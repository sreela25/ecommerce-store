<div class="filters">

    <input
        type="text"
        id="search"
        placeholder="Search Products"
        oninput="applyFilters()">

    <select
        id="categoryFilter"
        onchange="applyFilters()">

        <option value="">All Categories</option>

    </select>

        onchange="applyFilters()">

        <option value="">Sort By</option>

            Price: Low to High
        </option>

        <option value="high-low">
            Price: High to Low
        </option>

    </select>

</div>

    <div id="products"></div>

    <script src="script.js"></script>

    <script>
        if (localStorage.getItem("role") !== "admin") {
            document.getElementById("placeOrderBtn").style.display = "none";
        }
    </script>

    <script>
async function sendCartToWhatsApp() {

    const userId = localStorage.getItem("userId");

    if (!userId) {
        alert("Please login first");
        return;
    }

    try {

        const response = await fetch(
            `https://ecommerce-store-backend-sklo.onrender.com/api/cart/${userId}`
        );

        const cartItems = await response.json();

        if (cartItems.length === 0) {
            alert("Your cart is empty!");
            return;
        }

        let subtotal = 0;

        let message =
            "Hi, I want to place an order.\n\n";

        cartItems.forEach((item, index) => {

            const product = item.productId;

            const itemTotal =
                product.price * item.quantity;

            subtotal += itemTotal;

            message +=
                `${index + 1}. ${product.name}\n`;

            message +=
                `Quantity: ${item.quantity}\n`;

            message +=
                `Price: ₹${product.price}\n`;

            message +=
                `Subtotal: ₹${itemTotal}\n\n`;
        });

        // Calculate 5% discount
        let discount = 0;

        if (subtotal > 100) {
            discount = subtotal * 0.05;
        }

        const finalTotal =
            subtotal - discount;

        message +=
            `Subtotal: ₹${subtotal.toFixed(2)}\n`;

        if (discount > 0) {

            message +=
                `Discount: 5% OFF (-₹${discount.toFixed(2)})\n`;

        } else {

            message +=
                `Discount: No Discount\n`;
        }

        message +=
            `Final Total: ₹${finalTotal.toFixed(2)}\n\n`;

        message +=
            "Please confirm my order.";

        const phoneNumber = "919994996826";

        const whatsappURL =
            `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

        window.open(whatsappURL, "_blank");

    } catch (error) {

        console.error(error);

        alert("Unable to create WhatsApp order.");
    }
}

document.getElementById("whatsappOrderBtn").addEventListener(
    "click",
    sendCartToWhatsApp
);
</script>

</body>

</html>
