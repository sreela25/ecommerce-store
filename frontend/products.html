<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>

        <h2>E-Commerce Store</h2>

        <div>

            <a href="./products.html">Products</a>

            <a href="./cart.html">Cart</a>

            <a href="./orders.html">Orders</a>

            <a href="./admin.html" id="adminLink">Admin</a>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </nav>
    
    <br><a href="#" id="whatsappOrderBtn" class="whatsapp-btn">
    💬 Order on WhatsApp
</a><br>

    <h1>Products</h1>

<div class="filters">

    <input
        type="text"
        id="search"
        placeholder="Search Products"
        oninput="applyFilters()">

    <select
        id="categoryFilter"
        onchange="applyFilters()">

        <option value="">All Categories</option>

    </select>

    <select
        id="sort"
        onchange="applyFilters()">

        <option value="">Sort By</option>

        <option value="low-high">
            Price: Low to High
        </option>

        <option value="high-low">
            Price: High to Low
        </option>

    </select>

</div>

    <div id="products"></div>

    <script src="script.js"></script>

    <script>
        if (localStorage.getItem("role") !== "admin") {
            document.getElementById("placeOrderBtn").style.display = "none";
        }
    </script>

    <script>
async function sendCartToWhatsApp() {

    const userId = localStorage.getItem("userId");

    if (!userId) {
        alert("Please login first");
        return;
    }

    try {
        const response = await fetch(
            `https://ecommerce-store-backend-sklo.onrender.com/api/cart/${userId}`
        );

        const cartItems = await response.json();

        if (cartItems.length === 0) {
            alert("Your cart is empty!");
            return;
        }

        let message = "Hi, I want to place an order.%0A%0A";
        let total = 0;

        cartItems.forEach((item, index) => {

            const product = item.productId;

            const itemTotal = product.price * item.quantity;
            total += itemTotal;

            message += `${index + 1}. ${product.name}%0A`;
            message += `Quantity: ${item.quantity}%0A`;
            message += `Price: ₹${product.price}%0A`;
            message += `Subtotal: ₹${itemTotal}%0A%0A`;
        });

        message += `Total: ₹${total}%0A%0A`;
        message += "Please confirm my order.";

        const phoneNumber = "919994996826";

        const whatsappURL =
            `https://wa.me/${phoneNumber}?text=${message}`;

        window.open(whatsappURL, "_blank");

    } catch (error) {
        console.error(error);
        alert("Unable to create WhatsApp order.");
    }
}

document.getElementById("whatsappOrderBtn").addEventListener(
    "click",
    sendCartToWhatsApp
);
</script>

</body>

</html>
